[workspace]
resolver = "2"
members = [
  "crates/monitoros-core",
  "crates/provider-runtime",
  "crates/remote-server",
  "crates/storage",
  "crates/media-engine",
  "crates/platform-macos",
  "crates/platform-windows",
  "apps/desktop/src-tauri",

]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
tracing = "0.1"
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
